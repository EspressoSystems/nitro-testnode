name: Publish Rollup Creator Image
run-name: Publish Rollup Creator from @${{ github.actor }} of ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - integration
  workflow_dispatch:
    inputs:
      nitro_contracts_branch:
        description: "Nitro contracts branch to build from"
        required: false
        default: "fix-nitro-mock"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rollup-creator
  NITRO_CONTRACTS_BRANCH: ${{ inputs.nitro_contracts_branch || 'fix-nitro-mock' }}

jobs:
  build-and-publish:
    name: Build and publish rollup creator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: rollupcreator/
          file: rollupcreator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NITRO_CONTRACTS_BRANCH=${{ env.NITRO_CONTRACTS_BRANCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
